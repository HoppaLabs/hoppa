name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PINNED, not "latest".
      #
      # With latest, the toolchain that builds what ships can change with no
      # commit -- and it did: app.js came back from Pages 20 bytes longer than
      # the same commit built here, because a newer Bun minifies slightly
      # differently. The site was correct, but two things stopped being true.
      #
      # First, deploying is verified by comparing the bytes on Pages against
      # the bytes built here (docs/adr/0001). That check silently became
      # meaningless.
      #
      # Second, and worse: hard rule 6 says golden vectors are sacred, and the
      # engines are a determinism zone. A toolchain that can change underneath
      # a project making those promises is the wrong kind of surprise. Bump
      # this deliberately, in a commit, with the tests run against it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # Dev-only: typescript and @types/bun, for the typecheck below. Nothing
      # here reaches the bundle -- the runtime is still zero dependencies, and
      # the artifact this job uploads is built from src/ alone. See adr/0041.
      #
      # --frozen-lockfile so the toolchain cannot drift underneath a build, for
      # the same reason the bun version above is pinned rather than "latest".
      - run: bun install --frozen-lockfile

      # Never ship a build that fails the determinism check.
      - run: bun run check:determinism
      - run: bun run check:types
      - run: bun test
      - run: bun run build

      # enablement turns Pages on for the repo the first time this runs, so
      # publishing does not depend on someone having found the right settings
      # page. Needs the pages: write permission above, which we already have.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # A green deploy is not the same as a working URL. If the repo's Pages source
  # is ever set to a branch instead of GitHub Actions, GitHub's built-in Jekyll
  # build races this workflow and can overwrite dist/ with a rendering of
  # README.md -- the game 404s while every job here still reports success.
  # That happened once; the kids get a URL that works or CI goes red.
  smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: the published URL must serve the game, not something else
        run: |
          url="${{ needs.publish.outputs.page_url }}"
          echo "checking $url"

          # Pages propagation lags the deploy by a few seconds.
          for attempt in $(seq 1 20); do
            index=$(curl -fsS --max-time 15 "$url" || true)
            case "$index" in
              *'src="./app.js"'*) break ;;
            esac
            echo "  attempt $attempt: index.html is not the play page yet"
            index=""
            sleep 10
          done

          if [ -z "$index" ]; then
            echo "::error::$url is not serving the play page."
            echo "::error::Check Settings > Pages > Source is 'GitHub Actions', not a branch."
            curl -sS --max-time 15 "$url" | head -40
            exit 1
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${url}app.js")
          if [ "$code" != "200" ]; then
            echo "::error::${url}app.js returned $code -- the bundle is not published."
            exit 1
          fi

          worker=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${url}sw.js")
          if [ "$worker" != "200" ]; then
            echo "::error::${url}sw.js returned $worker -- the game will not work offline."
            exit 1
          fi

          for name in manifest.webmanifest icon-180.png; do
            got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${url}${name}")
            if [ "$got" != "200" ]; then
              echo "::error::${url}${name} returned $got -- the game cannot be kept on a home screen."
              exit 1
            fi
          done

          # The legal pages. These 404'd for weeks with every job green, because
          # nothing asked: they live in pippette/, only dist/ is uploaded, and
          # no check knew the difference. The privacy URL is on the App Store
          # listing -- if it stops resolving, the listing is in breach and the
          # first anyone hears of it is a review rejection. See adr/0077.
          for name in pippette/privacy/ pippette/terms/; do
            page=$(curl -fsS --max-time 15 "${url}${name}" || true)
            if [ -z "$page" ]; then
              echo "::error::${url}${name} did not serve -- the legal page is not published."
              exit 1
            fi
            case "$page" in
              *"<!doctype html>"*) ;;
              *) echo "::error::${url}${name} is not HTML. Raw Markdown downloads instead of rendering."
                 exit 1 ;;
            esac
            # A placeholder that reaches the live page makes the notice void.
            # The build refuses to emit one; this is the check that the thing
            # on Pages is the thing the build made.
            case "$page" in
              *"[COMPANY NAME]"*|*"[EMAIL]"*|*"[ADDRESS]"*|*"[DATE]"*|*"[REGION]"*)
                 echo "::error::${url}${name} is serving an unfilled template."
                 exit 1 ;;
            esac
          done

          echo "ok: index.html loads ./app.js; app.js, sw.js, the manifest and the icon are 200"
          echo "ok: the privacy policy and terms are published as HTML, with no placeholders"
