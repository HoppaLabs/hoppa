<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<!-- On a home screen the game is exempt from Safari's 7-day eviction, which is
     the only thing that keeps a drawn character. See docs/adr/0024. -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hoppa">
<link rel="icon" type="image/png" href="../icon-32.png">
<title>hoppa — make a level</title>
<style>
  :root {
    --bg: #0d1014; --ink: #7c8899; --ink-bright: #cdd6e0;
    --key: #222a35; --key-lit: #39485c; --edge: #1a212b;
    --gold: #ffc23d; --open: #6fe08a; --bad: #ff7a6b;
  }
  * { box-sizing: border-box; }
  /* ...except where you are meant to be typing. */
  input, textarea {
    -webkit-touch-callout: default;
    -webkit-user-select: text; user-select: text;
  }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-user-select: none; user-select: none;
    /* Reported live: "sometimes holding the button down brings up the iOS
       Safari text selection control". Holding a direction is how you walk, so
       this fires constantly. `user-select: none` alone does not stop it and
       neither does preventDefault on pointerdown -- on iOS the pointer events
       are synthesised from touch and cancelling them cancels nothing
       underneath. `-webkit-touch-callout` is the property that governs the
       long-press menu, and it was never set on any page. */
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) 10px max(14px, env(safe-area-inset-bottom));
    /* pan-y: the page scrolls, and nothing zooms.
       Three values, and only one of them is right:

         manipulation  turns off double-tap. LEAVES PINCH ALONE.
         none          the page handles its own touches -- INCLUDING SCROLL,
                       which is why this said `none` for a day and the creature
                       editor could not be scrolled at all. Reported as "I
                       can't scroll in the creature editor".
         pan-y         the one gesture a page actually needs, and no other.

       Every surface that must swallow a drag -- the paper, the pad, the grid,
       the canvases -- asks for `none` for itself further down. touch-action is
       not inherited, so each of them has to. */
    touch-action: pan-y;
  }
  h1 {
    margin: 0; font-size: 12px; font-weight: 400; letter-spacing: .14em;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  /* The wordmark. Pixel art, so whole scales and no smoothing -- see
     src/web/logo.ts. It carries the name visually; `.said` carries it for a
     screen reader, which cannot read a canvas. No border: the rule below is
     for the drawing canvases, and a frame round a logo is not a logo. */
  /* The width and height ATTRIBUTES on the element matter as much as this
     rule: an unsized canvas is 300x150, and for the frame before the script
     runs that is a header four times taller than the real one -- which is what
     the level gets fitted around. */
  #logo { display: block; image-rendering: pixelated; border: 0; border-radius: 0; }
  .said {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
  h1 b { color: var(--ink-bright); font-weight: 600; }
  h2 {
    margin: 2px 0 0; font-size: 12px; font-weight: 400; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink);
  }
  canvas { display: block; image-rendering: pixelated; border: 1px solid var(--edge); border-radius: 3px; }
  /* The drawing surface must not pan or zoom the page under a dragging finger. */
  #paper { touch-action: none; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button, input {
    font: inherit; color: var(--ink-bright); background: var(--key);
    border: 1px solid var(--edge); border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  /* A box you type in must not look like a button you press: same fix, and the
     same reason, as the drawing page. A field is a hole -- it sits below the
     page rather than on it, and the text starts where a caret would be. */
  input {
    cursor: text; text-align: left;
    background: var(--bg); border: 1px solid var(--key-lit);
    border-radius: 6px; box-shadow: inset 0 1px 2px rgb(0 0 0 / .5);
  }
  input:focus {
    outline: none; border-color: var(--gold);
    box-shadow: inset 0 1px 2px rgb(0 0 0 / .5), 0 0 0 2px rgb(255 194 61 / .25);
  }
  .field { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  /* A field is a label stacked on a box, so it is taller than the button beside
     it -- and a row that centres them puts the button level with the LABEL
     rather than with the box it belongs to. Line them up along the bottom, so
     the button sits on the same line as the thing it acts on. */
  .row:has(.field) { align-items: flex-end; }
  /* ...and where :has is not understood, the row stacks instead. Two lines is
     not as good as one, but it is never crooked. */
  @supports not selector(:has(*)) {
    .row { align-items: flex-end; }
  }
  .field label { font-size: 11px; color: var(--ink); }
  /* Six levels, two rows of three. Same idea as the sixteen characters on the
     drawing page, and drawn through the same renderer the game uses -- a
     thumbnail that is a picture OF a level rather than the level itself is a
     thumbnail that can lie. */
  #examples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
  #examples button {
    padding: 4px; display: grid; place-items: center; background: var(--key);
    border-radius: 8px;
    /* A grid item is min-width:auto by default, so a canvas 24 cells wide
       shoulders its own column past 1fr and the last one falls off the screen.
       Measured: three 432px canvases inside a 390pt column. */
    min-width: 0;
  }
  #examples canvas { width: 100%; max-width: 100%; height: auto; display: block; border-radius: 3px; }
  #examples .what { font-size: 10px; color: var(--ink); margin-top: 3px; }
  #examples button:active { border-color: var(--gold); }
  #took { min-height: 1.3em; font-size: 11px; color: var(--ink); text-align: center; max-width: 38ch; }
  #took button { padding: 4px 10px; font-size: 12px; margin: 0 3px; }
  #took .yes { border-color: var(--gold); color: var(--gold); }
  button.on { border-color: var(--gold); }
  button:disabled { opacity: .35; cursor: default; }
  a { color: var(--ink); }

  /*
    The whole editor is one flexible column that becomes two when there is room.
    A phone in portrait gets the level on top and the tools under it; a tablet,
    or a phone turned sideways, gets the tools beside the level instead of
    pushing it off the screen. Nothing is measured in device names -- the layout
    switches when the width can actually hold both.
  */
  #board { display: flex; gap: 14px; align-items: flex-start; justify-content: center;
           flex-wrap: wrap; width: 100%; }
  #stack { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  /* The level scrolls inside this once it is drawn bigger than the screen. */
  #viewport { position: relative; overflow: hidden; max-width: 100%; line-height: 0; }
  /* The aiming layer sits exactly on top of the level and never takes a tap. */
  #aim { position: absolute; left: 0; top: 0; pointer-events: none; border: 0; background: none; }
  #viewbar { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #viewbar button { padding: 6px 12px; font-size: 12px; }
  #pans { display: flex; gap: 4px; }
  #pans[hidden] { display: none; }
  #pans button { padding: 6px 10px; }
  #side { display: flex; flex-direction: column; gap: 10px; align-items: center;
          flex: 0 1 auto; min-width: min(280px, 100%); }

  /* Each tool shows what it draws AND what it is called. A swatch alone is a
     guessing game, and a word alone is a reading test. */
  #tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%;
           max-width: 340px; }

  /* Wide enough to hold both: the tools move beside the level instead of
     underneath it, and the level gets the rest. Keyed on what fits, not on
     what kind of device it is -- a phone turned sideways lands here too. */
  @media (min-width: 760px) {
    #side { align-items: stretch; min-width: 250px; max-width: 270px; }
    #tools { max-width: none; }
  }
  #tools button {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 8px 4px; font-size: 11px; line-height: 1;
  }
  #tools button.on { outline: 2px solid var(--gold); outline-offset: 2px; }
  /* Every chip gets an outline, because the clear one IS the floor colour and
     without a border it looked like a missing icon rather than an empty box. */
  /* The chip holds the real tile on a canvas, so it gets no background of its
     own -- and the rubber sits over it, the way it does on the character
     editor's see-through pen. */
  /* The canvas fills the chip exactly. It used to be given the chip's OUTER
     size while box-sizing made the content box two pixels smaller, so the
     drawing sat one pixel down and right and the chip's own dark background
     showed as an L along the top and left. */
  #tools .chip {
    /* A whole multiple of the art grid: 32 is two screen pixels per art pixel,
       so the tile and the sprite drawn in it are at the same scale and neither
       is resampled. At 24 the tile filled the box at 1.5 and the sprite sat in
       the middle at 1, which is the same mismatch the rooms had. */
    width: 32px; height: 32px; border-radius: 4px; border: 1px solid var(--ink);
    position: relative; overflow: hidden; display: block; padding: 0;
  }
  #tools .chip canvas { display: block; width: 100%; height: 100%; }
  #tools .rubber { position: absolute; inset: 0; display: grid; place-items: center; }
  #tools .rubber svg { display: block; width: 16px; height: 16px; }
  #tools .rubber svg path {
    fill: none; stroke: var(--ink-bright); stroke-width: 2.5;
    stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 2px #0d1014) drop-shadow(0 0 2px #0d1014);
  }
  #tools .count { font-size: 10px; color: var(--ink); }

  /* Five tabs, and a phone is 360 pixels wide.
     WRAPS rather than scrolls: a strip that scrolls sideways hides whatever is
     past the edge, and the fifth tab -- the newest one, the one nobody knows
     is there -- is exactly what ends up past it. Two rows of readable buttons
     beat one row with a secret in it. */
  #games {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 6px; width: 100%; max-width: 340px;
  }
  #games button {
    flex: 1 1 auto; min-width: 88px; font-size: 12px; padding: 9px 6px;
  }

  #name { width: min(220px, 100%); }

  /* The check strip. One line, plain words, and it only shouts when something
     actually stops the level working. */
  #says {
    min-height: 2.6em; text-align: center; max-width: 40ch; font-size: 12px;
    display: flex; align-items: center; justify-content: center; padding: 0 4px;
  }
  #says.bad { color: var(--bad); }
  #says.warn { color: var(--gold); }
  #says.good { color: var(--open); }
  #play { background: var(--open); color: var(--bg); font-weight: 600; border: 0; }
  #play:disabled { background: var(--key); color: var(--ink); }
  #sendit { border-color: var(--gold); color: var(--gold); }
  #sendit[hidden] { display: none; }
  /* The link itself may end up in here, and a level code is 200 characters of
     base64 with no spaces in it. Break it anywhere rather than push the page
     sideways. */
  #sent {
    font-size: 11px; color: var(--ink); text-align: center; max-width: 38ch;
    overflow-wrap: anywhere;
  }
  #sent[hidden] { display: none; }
  #sent.bad { color: var(--bad); }
  .hint { font-size: 11px; color: var(--ink); text-align: center; max-width: 38ch; }
  /* A question that stops the world goes over the middle of it. Inline, under
     the thumbnails, it was below the fold on a phone and easy to miss. */
  #ask[hidden] { display: none; }
  #ask {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center;
    background: rgba(13, 16, 20, .72);
    padding: 20px;
  }
  #ask .sheet {
    background: var(--key); border: 1px solid var(--gold); border-radius: 12px;
    padding: 18px 18px 14px; max-width: 22rem; width: 100%;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .5);
  }
  #ask p { margin: 0 0 14px; color: var(--ink-bright); font-size: 15px; line-height: 1.35; }
  #ask .row { display: flex; gap: 10px; justify-content: flex-end; }
  #ask button {
    font: inherit; font-size: 14px; color: var(--ink-bright); background: none;
    border: 1px solid var(--edge); border-radius: 8px; padding: 9px 14px; cursor: pointer;
  }
  #ask button.yes { border-color: var(--gold); color: var(--gold); }
  #ask button:active { background: var(--key-lit); }
</style>
</head>
<body>

<h1><canvas id="logo" width="120" height="36" aria-hidden="true"></canvas><span class="said">hoppa</span> &middot; <b>make a level</b></h1>

<div id="board">
  <div id="stack">
    <div id="viewport">
      <canvas id="paper" aria-label="the level you are drawing"></canvas>
      <!-- Crosshair and target ring, drawn over the level while a finger is
           down. A finger covers about three cells; lines that run to the edges
           stay visible either side of it. -->
      <canvas id="aim" aria-hidden="true"></canvas>
    </div>
    <div id="viewbar">
      <button id="zoom">bigger</button>
      <span id="pans" hidden>
        <button id="panleft" aria-label="look left">&#9664;</button>
        <button id="panup" aria-label="look up">&#9650;</button>
        <button id="pandown" aria-label="look down">&#9660;</button>
        <button id="panright" aria-label="look right">&#9654;</button>
      </span>
      <!-- Under the level, because it happens IN the level. It was at the
           bottom of the page under nine thumbnails, which is a long way from
           the thing it plays. -->
      <button id="watch">auto play</button>
    </div>
    <!-- ...and what the checks make of it, in the same breath. This was the
         last thing on the page: "there is no way out" is about the picture,
         and it belongs beside the picture. -->
    <div id="says"></div>
  </div>

  <div id="side">
    <div id="games" role="group" aria-label="which game this level is for"></div>

    <h2>what to draw with</h2>
    <div id="tools" role="group" aria-label="drawing tools"></div>

    <div class="row">
      <span class="field">
        <label for="name">what your level is called:</label>
        <input id="name" maxlength="24" value="my level">
      </span>
    </div>

    <div class="row">
      <button id="play">play it</button>
      <!-- Hidden until a bot has been through THIS room and got out. Not a
           lock on drawing: a level you cannot finish is still yours to draw,
           play and keep. It is the one honest claim the editor can make about
           a room the child has not played -- see src/web/level/sendable.ts. -->
      <button id="sendit" hidden>send it</button>
      <button id="clear">start over</button>
    </div>
    <div id="sent" hidden></div>

    <!-- Last, and on purpose. Nine thumbnails is the tallest thing on this
         page and it is the one thing you use ONCE, before you have drawn
         anything -- it was sitting between the tools and the buttons, so
         finishing a level meant scrolling past every level you were not
         making. -->
    <h2>or start from one of these</h2>
    <div id="examples"></div>
    <div id="took"></div>

    <div class="row"><a href="../">back to the game</a></div>
  </div>
</div>

<script type="module" src="./level.js"></script>
<div id="ask" hidden></div>
</body>
</html>
