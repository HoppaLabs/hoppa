<title>hoppa — your character</title>
<style>
  :root {
    --bg: #0d1014; --ink: #7c8899; --ink-bright: #cdd6e0;
    --key: #222a35; --key-lit: #39485c; --edge: #1a212b;
    --gold: #ffc23d; --open: #6fe08a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    touch-action: manipulation;
  }
  h1 {
    margin: 0; font-size: 12px; font-weight: 400; letter-spacing: .14em;
    text-transform: uppercase;
  }
  h1 b { color: var(--ink-bright); font-weight: 600; }
  canvas { display: block; image-rendering: pixelated; border: 1px solid var(--edge); border-radius: 3px; }
  #paper { touch-action: none; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button, input {
    font: inherit; color: var(--ink-bright); background: var(--key);
    border: 1px solid var(--edge); border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  input { cursor: text; width: 9em; text-align: center; }
  button.on { border-color: var(--gold); }
  /* The four inks. The swatch IS the colour, so it needs no label. */
  #inks button { width: 52px; height: 44px; padding: 0; position: relative; }
  #inks button.on { outline: 2px solid var(--gold); outline-offset: 2px; }
  #inks .none { background:
      linear-gradient(45deg, #1a212b 25%, transparent 25%, transparent 75%, #1a212b 75%) 0 0/12px 12px,
      linear-gradient(45deg, #1a212b 25%, #0d1014 25%, #0d1014 75%, #1a212b 75%) 6px 6px/12px 12px; }
  #swatches { display: grid; grid-template-columns: repeat(9, 30px); gap: 4px; }
  #swatches button { width: 30px; height: 26px; padding: 0; border-radius: 5px; }
  #swatches button.on { outline: 2px solid var(--ink-bright); outline-offset: 1px; }
  #go { background: var(--open); color: var(--bg); font-weight: 600; border: 0; }
  #note { min-height: 1.3em; text-align: center; max-width: 36ch; }
  a { color: var(--ink); }
  .hint { font-size: 11px; color: var(--ink); text-align: center; max-width: 34ch; }
</style>

<h1>hoppa &middot; <b>your character</b></h1>

<canvas id="paper" width="320" height="320"></canvas>

<div class="row" id="inks"></div>
<div class="hint">pick an ink, then draw. three colours and see-through — that is the whole box.</div>

<div class="row">
  <span>colour <b id="slotname">1</b>:</span>
  <button id="slot1" class="on">1</button>
  <button id="slot2">2</button>
  <button id="slot3">3</button>
</div>
<div id="swatches"></div>

<div class="row">
  <input id="name" maxlength="12" value="Mine" aria-label="creature name">
  <button id="build">body: Bruk</button>
</div>
<div class="hint">the body decides what it can <i>do</i>. what you draw never changes that.</div>

<div class="row">
  <button id="clear">clear</button>
  <button id="go">play as this</button>
</div>
<div id="note"></div>
<div class="row"><a href="../">back to the game</a></div>

<script type="module" src="./make.js"></script>
