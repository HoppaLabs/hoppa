<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<!-- On a home screen the game is exempt from Safari's 7-day eviction, which is
     the only thing that keeps a drawn character. See docs/adr/0024. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hoppa">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230d1014'/%3E%3Crect x='2' y='2' width='4' height='4' fill='%23ffc23d'/%3E%3C/svg%3E">
<title>Hoppa - Open Games</title>
<style>
  :root {
    --bg: #0d1014;
    --ink: #7c8899;
    --ink-bright: #cdd6e0;
    --key: #222a35;
    --key-lit: #39485c;
    --edge: #1a212b;
    --gold: #ffc23d;
    --open: #6fe08a;
  }
  * { box-sizing: border-box; }
  /* ...except where you are meant to be typing. */
  input, textarea {
    -webkit-touch-callout: default;
    -webkit-user-select: text; user-select: text;
  }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-user-select: none; user-select: none;
    /* Reported live: "sometimes holding the button down brings up the iOS
       Safari text selection control". Holding a direction is how you walk, so
       this fires constantly. `user-select: none` alone does not stop it and
       neither does preventDefault on pointerdown -- on iOS the pointer events
       are synthesised from touch and cancelling them cancels nothing
       underneath. `-webkit-touch-callout` is the property that governs the
       long-press menu, and it was never set on any page. */
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    /* 10, not 14: a reply page has two more rows than a plain one (the
       challenge, and a fourth creature), and eight gaps at 14px was 112px of
       a 664px phone -- spent on air, taken off the level. */
    justify-content: center; gap: 10px; padding: max(10px, env(safe-area-inset-top)) 10px
             max(10px, env(safe-area-inset-bottom));
    /* NONE, not `manipulation`.
       `manipulation` only turns off double-tap zoom. It leaves PINCH alone --
       which is the gesture two thumbs make by accident all game long, and it
       got worse the moment the pad became something you drag rather than tap.
       `none` is the value that says "this page handles its own touches", and
       it is the only one the browser applies before any script runs.
       Anything that genuinely scrolls asks for it back below. */
    touch-action: none;
  }
  /* The title stays centred on the page, so the sound icon is taken out of the
     flow and hung on the right rather than allowed to push it off centre. It
     costs the level no height at all: the row is as tall as the title was. */
  #top {
    position: relative; width: 100%; display: flex;
    align-items: center; justify-content: center;
  }
  h1 {
    margin: 0; font-size: 12px; font-weight: 400; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  /* The wordmark. Pixel art, so whole scales and no smoothing -- see
     src/web/logo.ts. It carries the name visually; `.said` carries it for a
     screen reader, which cannot read a canvas. */
  /* No border: the rule further down is for the game canvases, and a frame
     round a logo is not a logo. */
  /* The width and height ATTRIBUTES on the element matter as much as this
     rule: an unsized canvas is 300x150, and for the frame before the script
     runs that is a header four times taller than the real one -- which is what
     the level gets fitted around. */
  #logo { display: block; image-rendering: pixelated; border: 0; border-radius: 0; }
  .said {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
  h1 b { color: var(--ink-bright); font-weight: 600; }
  #stage {
    width: 100%; display: flex; justify-content: center;
    touch-action: none;
  }
  canvas {
    display: block; image-rendering: pixelated;
    border: 1px solid var(--edge); border-radius: 3px;
  }
  /* --- the handset -------------------------------------------------------
     A cross on the left, round buttons on the right: the shape of every
     8-bit handheld, and a shape a child's thumbs already know. Generic on
     purpose -- a grey cross and two coloured circles is the FORM those
     machines share, and none of anybody's trade dress is borrowed.

     One control, not four. See src/web/play/dpad.ts for why that is the
     whole point. */
  #pad {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(28px, 12vw, 76px);
    width: 100%;
    touch-action: none;
  }
  #dpad {
    position: relative;
    width: 156px; height: 156px;
    flex: none;
    touch-action: none;
    /* The cross itself: two bars crossed, with the corners cut away. */
    background:
      linear-gradient(var(--key), var(--key)) 50% 0 / 33.4% 100% no-repeat,
      linear-gradient(var(--key), var(--key)) 0 50% / 100% 33.4% no-repeat;
    filter: drop-shadow(0 2px 0 #000a);
  }
  /* The arms, drawn as one piece so the cross has a single outline. */
  #dpad::before {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(transparent 0, transparent 33.3%, #0000 0) no-repeat;
    clip-path: polygon(
      33.3% 0, 66.7% 0, 66.7% 33.3%, 100% 33.3%, 100% 66.7%, 66.7% 66.7%,
      66.7% 100%, 33.3% 100%, 33.3% 66.7%, 0 66.7%, 0 33.3%, 33.3% 33.3%);
    border: 1px solid var(--edge);
    box-sizing: border-box;
    pointer-events: none;
  }
  /* The four arrows, and the lit state when a direction is held. */
  #dpad i {
    position: absolute; display: grid; place-items: center;
    width: 33.3%; height: 33.3%;
    color: var(--ink); font-style: normal; font-size: 17px; line-height: 1;
    pointer-events: none;
    transition: color 60ms linear;
  }
  #dpad i.on { color: var(--gold); }
  #dpad .u { left: 33.35%; top: 0; }
  #dpad .d { left: 33.35%; bottom: 0; }
  #dpad .l { left: 0; top: 33.35%; }
  #dpad .r { right: 0; top: 33.35%; }
  /* The dish in the middle, so the cross reads as one moulded piece rather
     than as four keys that happen to touch. */
  #dpad .hub {
    position: absolute; left: 33.35%; top: 33.35%; width: 33.3%; height: 33.3%;
    background: radial-gradient(circle at 50% 40%, #0004, #0000 70%);
    pointer-events: none;
  }

  /* Two round buttons, set on the diagonal the way a handheld sets them: the
     lower-left one falls under a thumb at rest, so it is the one you press
     most -- jump from the side, the weapon from above. */
  /* The same box as the pad, so the two clusters sit on one centre line. */
  #keys {
    position: relative; width: 156px; height: 156px; flex: none;
  }
  #pad #keys button {
    position: absolute; width: 68px; height: 68px; border-radius: 50%;
    display: grid; place-items: center; padding: 0;
    font: inherit; font-size: 19px; color: var(--ink-bright);
    background: var(--key); border: 1px solid var(--edge);
    box-shadow: 0 2px 0 #000a;
    touch-action: none; cursor: pointer;
  }
  #pad #keys button:active, #pad #keys button.lit {
    background: var(--key-lit); transform: translateY(2px); box-shadow: none;
  }
  /* On the diagonal, the way a handheld sets them: the lower-left circle is
     the one under a thumb at rest, so it is the one you press most -- jump
     from the side, the weapon from above. */
  #wait { left: 4px; bottom: 18px; }
  #swing, #water { right: 4px; top: 18px; }
  /* AT LEAST as specific as the button rule above, or it does not hide.
     `#pad #keys button` is two ids and a type; `#water[hidden]` is one id and
     an attribute, and loses -- so `hidden` stopped hiding, the bucket sat on
     top of the sword in every side-on level, and the garden showed an empty
     action button it is supposed to have none of. */
  #pad #keys button[hidden] { display: none; }
  #pad #keys button svg { display: block; }
  /* Pouring takes a moment and the button says so, or a child taps it again
     thinking it did not work. */
  #water.pouring { background: var(--key-lit); }
  /* Waiting is a move. Guards patrol on a fixed cycle, so standing still to let
     one walk past is the whole skill of day 3 -- without this button the level
     is not beatable on a phone. */
  #wait.word { font-size: 11px; letter-spacing: .1em; color: var(--ink); }
  /* With only one action button there is no diagonal to sit on, so it takes
     the middle of the cluster: level with the pad, still under the thumb. */
  #pad.one #swing, #pad.one #water { display: none; }
  #pad.one #wait { left: 50%; top: 50%; bottom: auto; transform: translate(-50%, -50%); }
  #pad.one #wait:active, #pad.one #wait.lit {
    transform: translate(-50%, -50%) translateY(2px);
  }
  @media (max-width: 380px) {
    #dpad { width: 132px; height: 132px; }
    #keys { width: 132px; height: 132px; }
    #pad #keys button { width: 62px; height: 62px; }
    #wait { bottom: 10px; } #swing, #water { top: 10px; }
  }
  footer { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
  #hud { color: var(--ink); display: flex; gap: 12px; }
  #hud b { color: var(--ink-bright); font-weight: 600; }
  #hud .gold b { color: var(--gold); }
  #hud .done b { color: var(--open); }
  #hud .alarm b { color: var(--ink); letter-spacing: .1em; font-weight: 400; }
  #hud .alarm-1 b { color: #ffc23d; }
  #hud .alarm-2 b { color: #ff8a3d; }
  #hud .alarm-3 b { color: #ff5f4d; }
  /* A free step is a turn the clock did not charge you for. Worth seeing. */
  #hud .free b { color: var(--open); }
  #hud .hearts b { color: #ff5f4d; letter-spacing: .08em; }
  /* Air. Blue while there is plenty, then the same two warning colours the
     clock already uses, so a child only learns one language of alarm. */
  #hud .air b { color: #6fb2f0; letter-spacing: .08em; }
  #hud .air-1 b { color: #ff9f3d; letter-spacing: .08em; }
  #hud .air-0 b { color: #ff2d1a; letter-spacing: .08em; }
  #hud .hearts-0 b, #hud .hearts-1 b { color: #ff2d1a; }
  /* The sword button. A word did not fit at any size the thumb still liked,
     and an icon needs no translating for a six-year-old. */
  #wait { display: grid; place-items: center; padding: 0; }
  #wait svg { display: block; }

  /* The win screen. It sits over the grid rather than replacing it, so the
     level you just beat is still there behind the words. */
  /* The picker. Three creatures, and a line saying what each one is bad at --
     the trade is the interesting part, not the stats. */
  #stable { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #stable button {
    font: inherit; font-size: 12px; color: var(--ink);
    background: var(--key); border: 1px solid var(--edge); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; line-height: 1.3; text-align: center;
    /* Face above the name, not beside it. Side by side, four creatures were
       473px of a 370px phone and wrapped onto a second row; stacked they are
       320 and fit, which keeps the descriptions AND the drawings. */
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  #stable button b { display: block; color: var(--ink-bright); font-size: 13px; }
  /* The creature itself. Three words say what it does; only the drawing says
     which one is yours. Blown up from 16x16, so it must not be smoothed. */
  #stable .face {
    width: 26px; height: 26px; flex: none;
    image-rendering: pixelated;
  }
  #stable.tight .face { width: 22px; height: 22px; }
  /* Four creatures on a phone wrap onto a second row, and the level pays for
     it in height. Crowded rows get smaller keys instead. */
  /* Four creatures stacked come to 357px of a 370px phone before padding, so
     a crowded row spends less on it. A very long name can still wrap, and the
     level gives up some height when it does -- but the usual case fits. */
  #stable.tight { gap: 4px; }
  #stable.tight button { font-size: 11px; padding: 5px 6px; }
  #stable.tight button b { font-size: 12px; }
  /* The friend's creature. It can share a name with a preset, so it needs to
     be findable by eye as well as by the line under the name. */
  #stable button.guest { border-style: dashed; border-color: var(--gold); }
  #stable button.on { border-color: var(--gold); color: var(--ink-bright); }
  #stable button.on b { color: var(--gold); }
  /* The value first, then what the value buys -- two rows a kid reads across
     rather than three adjectives that hid the numbers they just spent. */
  /* Two values, side by side. It has been three adjectives and then values
     plus what they buy; both were more than anybody reads with a guard walking
     towards them. */
  #trait {
    color: var(--ink); font-size: 12px;
    display: flex; gap: 18px; justify-content: center;
  }
  #trait .pair { display: flex; gap: 7px; align-items: baseline; }
  #trait .what { color: var(--ink-bright); font-weight: 600; }
  #trait .pips { color: var(--gold); letter-spacing: 1px; }

  #stage { position: relative; }
  /* The win screen covers the whole page, not just the board. Once there is a
     QR code on it, it is taller than the grid and would otherwise spill over
     the controls. Its own scroll, so a short phone can still reach the buttons. */
  #over {
    position: fixed; inset: 0; z-index: 10; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(13, 16, 20, .95); text-align: center;
    padding: 20px 12px; overflow-y: auto;
    /* The one thing on this page that scrolls: the panel after a win, which on
       a short phone is taller than the screen. pan-y gives back the drag it
       needs and nothing else -- no pinch, no double-tap. */
    touch-action: pan-y;
  }
  #over.show { display: flex; }
  /* touch-action is NOT inherited, so every surface a thumb can land on has to
     say it for itself. The two that were left were the ones a stray tap
     actually finds: #keys is the GAP between the two round buttons, and #grid
     is the whole board. Both read `auto` -- the browser's to interpret -- while
     everything around them was locked down. */
  #keys, #grid, canvas { touch-action: none; }
  /* ...and inside the end panel the drag has to keep working all the way down,
     not only on the panel's own background. */
  #over * { touch-action: pan-y; }
  #shut {
    position: absolute; top: 10px; right: 10px;
    font: inherit; font-size: 18px; line-height: 1; color: var(--ink);
    background: none; border: 1px solid var(--edge); border-radius: 8px;
    width: 40px; height: 40px; cursor: pointer;
  }
  #shut:active { background: var(--key); color: var(--ink-bright); }
  #verdict {
    font-size: 22px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--open); font-weight: 600;
  }
  #over.lost #verdict { color: #ff5f4d; }
  #saying { color: var(--ink-bright); max-width: 30ch; font-size: 13px; }
  #tally { color: var(--ink); }
  #again {
    font: inherit; font-size: 14px; color: var(--bg); background: var(--open);
    border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer;
    font-weight: 600;
  }
  #over.lost #again { background: #ff5f4d; }
  #sendit {
    font: inherit; font-size: 14px; color: var(--bg); background: var(--gold);
    border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer;
    font-weight: 600;
  }
  #sendit[hidden] { display: none; }
  #over .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  /* The QR code. Two kids in the same room with no messaging app between them
     can still pass a level across: one holds up the screen, the other points a
     camera at it. It needs a white quiet zone around it or nothing will read
     it, which is why it is not simply drawn on the dark background. */
  #qr {
    display: block; image-rendering: pixelated; border-radius: 4px;
    background: #ffffff; padding: 0;
  }
  #qr[hidden] { display: none; }
  #qrhint { font-size: 11px; color: var(--ink); max-width: 32ch; }
  #qrhint b { color: var(--ink-bright); }
  #qrhint[hidden] { display: none; }
  #sent {
    font-size: 12px; color: var(--open); max-width: 32ch; line-height: 1.4;
    /* `anywhere` breaks only when it has to. `break-all` split "friend" across
       two lines in a sentence that had room. */
    overflow-wrap: anywhere;
  }
  #sent[hidden] { display: none; }
  #sent.bad { color: var(--gold); }
  /* Same size, same colour, same distance from its edge as the sound icon --
     they read as a pair only if they are actually identical. */
  #reset, #sound {
    position: absolute; top: 50%; transform: translateY(-50%);
    color: var(--ink); background: none; border: 0; padding: 6px;
    cursor: pointer; line-height: 0;
    -webkit-tap-highlight-color: transparent;
  }
  #reset { left: 0; }
  #reset svg { display: block; width: 20px; height: 20px; }
  #reset path {
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  #reset:active { color: var(--gold); }
  /* A 32px target on a 12px row. Smaller than the 44px a thumb wants, and
     deliberately so -- these sit beside the title, and anything bigger makes
     the header taller, which comes straight off the level. */
  #sound { right: 0; }
  #sound svg { display: block; width: 20px; height: 20px; }
  #sound .cone { fill: currentColor; }
  #sound .on, #sound .off {
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  /* Which half of the icon is drawn IS the state, so there is no wording to
     get out of step with aria-pressed. */
  #sound .on { display: none; }
  #sound[aria-pressed="true"] .on { display: inline; }
  #sound[aria-pressed="true"] .off { display: none; }
  #sound[aria-pressed="true"] { color: var(--gold); }
  /* Two doors, and neither is the one to press.
     "edit character" wore a gold border and "make a level" an --edge one, so
     the first looked permanently selected and the second barely looked like a
     button at all: measured against the page background, gold is 11.8:1 and
     --edge is 1.18:1, on a fill of only 1.32:1. The gold was never decoration
     -- it was the only thing giving that button an outline.
     Both wear it now. They are a pair and they are drawn as a pair; what the
     gold no longer says is "press this one". */
  /* Same shape as the two doors beside it: it is a third thing you can do from
     here, not a control on the game above it. */
  #another, #draw, #build {
    font: inherit; color: var(--ink-bright); background: var(--key);
    border: 1px solid var(--gold); border-radius: 6px; padding: 6px 12px;
    cursor: pointer; text-decoration: none;
    /* Three of them on a phone means two words over two lines, and a label
       that wraps is a label that has to be centred: ranged left inside a
       centred button it reads as a mistake. */
    text-align: center; line-height: 1.25;
  }
  #another:active, #draw:active, #build:active { background: var(--key-lit); }
  /* One row, always. They are a pair, and a pair that wraps reads as two
     unrelated buttons. */
  #edits { display: flex; gap: 10px; justify-content: center; flex-wrap: nowrap; }
  /* A moment's feedback over the board: what just happened, then gone. It sits
     on the level rather than under it so a thumb on the buttons still sees it. */
  #flash {
    position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
    background: rgba(13,16,20,.86); border: 1px solid var(--edge); border-radius: 8px;
    padding: 5px 12px; color: var(--ink-bright); font-size: 12px; white-space: nowrap;
    opacity: 0; transition: opacity .18s; pointer-events: none;
  }
  #flash.show { opacity: 1; }
  #boast {
    color: var(--gold); font-size: 14px; text-align: center; max-width: 34ch;
    line-height: 1.35; margin: 0 0 2px;
  }
  /* Both lists work the same way and share their look: a line you tap, and a
     column of levels behind it. Open costs the play area a third of its height
     on a phone, which is why neither starts open. */
  /* The list of shipped rooms and the list of levels you played before both
     used to live here. They are gone: this page is for playing, and the six
     rooms are now something to start FROM in the level editor, next to the
     sixteen characters on the drawing page. Two pages that pick things, one
     that plays. */
  #said {
    color: var(--ink); font-size: 12px; min-height: 1.3em; text-align: center;
    max-width: 40ch; word-break: break-all;
  }
</style>
</head>
<body>
  <header id="top">
    <!-- Mirrors the sound icon on the right. Both are things you reach for
         between attempts rather than during one, so neither belongs in the
         row of things you came here to do. -->
    <button id="reset" aria-label="start again">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.3-5.6"/>
        <path d="M20 3v5h-5"/>
      </svg>
    </button>
    <h1><canvas id="logo" width="120" height="36" aria-hidden="true"></canvas><span class="said">hoppa</span> &middot; <span id="levelname">delve</span></h1>
    <!-- Off until asked for: a link gets opened on a bus. See src/web/play/sound.ts.
         An icon rather than the words "sound off", because it is a setting you
         touch once and then never again, and it was taking a place in the row
         of things you actually came here to do. -->
    <button id="sound" aria-pressed="false" aria-label="turn sound on">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="cone" d="M4 9h3.5L12 5v14L7.5 15H4z"/>
        <path class="on" d="M15.5 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>
        <path class="off" d="M16 9.5l5.5 5.5M21.5 9.5L16 15"/>
      </svg>
    </button>
  </header>
  <!-- A reply from a friend: their time, and a nudge towards their creature.
       It sits above the picker because that is what it points at. -->
  <div id="boast" role="status" hidden></div>
  <nav id="stable" aria-label="pick a creature"></nav>
  <div id="trait"></div>
  <div id="stage">
    <canvas id="grid"></canvas>
    <div id="flash" role="status" aria-live="polite"></div>
    <div id="over" role="status" aria-live="polite">
      <!-- The panel covers the whole screen, so without this there is no way to
           look at the room you just finished, or at where you died. -->
      <button id="shut" aria-label="close">&#10005;</button>
      <div id="verdict"></div>
      <div id="saying"></div>
      <div id="tally"></div>
      <canvas id="qr" hidden aria-label="this level as a square you can scan"></canvas>
      <div id="qrhint" hidden>a friend's phone can scan this to play <b>your level</b></div>
      <div class="row">
        <button id="again">play again</button>
        <button id="sendit" hidden>share level</button>
      </div>
      <!-- The answer to tapping share belongs next to share. It used to appear
           at the very bottom of the page, three hundred pixels below where the
           thumb was, and read as nothing having happened. -->
      <div id="sent" hidden></div>
    </div>
  </div>
  <nav id="pad">
    <!-- ONE control, not four. It captures the pointer once and reads the
         thumb's position on every move, so you can roll from one direction to
         the next and hold two at once. See src/web/play/dpad.ts. -->
    <div id="dpad" role="group" aria-label="move">
      <i class="u">&#9650;</i><i class="r">&#9654;</i>
      <i class="d">&#9660;</i><i class="l">&#9664;</i>
      <span class="hub"></span>
    </div>
    <div id="keys">
      <button id="wait" aria-label="action"></button>
      <!-- Only the side-on game needs this: from above the action button IS the
           weapon, and a second one would be the same button twice. -->
      <button id="swing" aria-label="swing" hidden></button>
      <!-- The bucket, on a level that has a fire in it. A button that can never
           do anything is worse than no button. -->
      <button id="water" aria-label="pour water" hidden></button>
    </div>
  </nav>
  <footer>
    <span id="hud"></span>
  </footer>
  <!-- The two things you can make, side by side and equal. Neither is the one
       to press: see the note on #draw, #build. -->
  <nav id="edits" aria-label="things you can make">
    <button id="another">play another</button>
    <a id="draw" href="./make/">edit character</a>
    <a id="build" href="./level/">make a level</a>
  </nav>
  <div id="said"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
