<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230d1014'/%3E%3Crect x='2' y='2' width='4' height='4' fill='%23ffc23d'/%3E%3C/svg%3E">
<title>hoppa — day 3</title>
<style>
  :root {
    --bg: #0d1014;
    --ink: #7c8899;
    --ink-bright: #cdd6e0;
    --key: #222a35;
    --key-lit: #39485c;
    --edge: #1a212b;
    --gold: #ffc23d;
    --open: #6fe08a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: max(10px, env(safe-area-inset-top)) 10px
             max(10px, env(safe-area-inset-bottom));
    touch-action: manipulation;
  }
  h1 {
    margin: 0; font-size: 12px; font-weight: 400; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink);
  }
  h1 b { color: var(--ink-bright); font-weight: 600; }
  #stage {
    width: 100%; display: flex; justify-content: center;
    touch-action: none;
  }
  canvas {
    display: block; image-rendering: pixelated;
    border: 1px solid var(--edge); border-radius: 3px;
  }
  #pad {
    display: grid; gap: 8px;
    grid-template-columns: repeat(3, 72px);
    grid-template-rows: repeat(2, 62px);
    grid-template-areas: "wait up  ." "left down right";
  }
  #pad button {
    font: inherit; font-size: 20px; color: var(--ink-bright);
    background: var(--key); border: 1px solid var(--edge); border-radius: 10px;
    touch-action: manipulation; cursor: pointer;
  }
  #pad button:active, #pad button.lit { background: var(--key-lit); }
  #up { grid-area: up; } #left { grid-area: left; }
  #down { grid-area: down; } #right { grid-area: right; }
  /* Waiting is a move. Guards patrol on a fixed cycle, so standing still to let
     one walk past is the whole skill of day 3 -- without this button the level
     is not beatable on a phone. */
  #wait { grid-area: wait; font-size: 11px; letter-spacing: .1em; color: var(--ink); }
  footer { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
  #hud { color: var(--ink); display: flex; gap: 12px; }
  #hud b { color: var(--ink-bright); font-weight: 600; }
  #hud .gold b { color: var(--gold); }
  #hud .done b { color: var(--open); }
  #hud .alarm b { color: var(--ink); letter-spacing: .1em; font-weight: 400; }
  #hud .alarm-1 b { color: #ffc23d; }
  #hud .alarm-2 b { color: #ff8a3d; }
  #hud .alarm-3 b { color: #ff5f4d; }

  /* The win screen. It sits over the grid rather than replacing it, so the
     level you just beat is still there behind the words. */
  #stage { position: relative; }
  #over {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(13, 16, 20, .86); border-radius: 3px; text-align: center;
    padding: 12px;
  }
  #over.show { display: flex; }
  #verdict {
    font-size: 22px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--open); font-weight: 600;
  }
  #over.lost #verdict { color: #ff5f4d; }
  #saying { color: var(--ink-bright); max-width: 30ch; font-size: 13px; }
  #tally { color: var(--ink); }
  #again {
    font: inherit; font-size: 14px; color: var(--bg); background: var(--open);
    border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer;
    font-weight: 600;
  }
  #over.lost #again { background: #ff5f4d; }
  #reset {
    font: inherit; color: var(--ink); background: none;
    border: 1px solid var(--edge); border-radius: 6px; padding: 5px 10px;
    cursor: pointer;
  }
  #reset:active { background: var(--key); }
</style>
</head>
<body>
  <h1>hoppa <b>day 3</b> &middot; delve</h1>
  <div id="stage">
    <canvas id="grid"></canvas>
    <div id="over" role="status" aria-live="polite">
      <div id="verdict"></div>
      <div id="saying"></div>
      <div id="tally"></div>
      <button id="again">play again</button>
    </div>
  </div>
  <nav id="pad">
    <button id="wait"  aria-label="wait one turn">WAIT</button>
    <button id="up"    aria-label="up">&#9650;</button>
    <button id="left"  aria-label="left">&#9664;</button>
    <button id="down"  aria-label="down">&#9660;</button>
    <button id="right" aria-label="right">&#9654;</button>
  </nav>
  <footer>
    <span id="hud"></span>
    <button id="reset">reset</button>
  </footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
